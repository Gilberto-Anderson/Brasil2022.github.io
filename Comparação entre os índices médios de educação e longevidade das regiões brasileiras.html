<!DOCTYPE html>
<html>
<head>
  <script src="https://cdn.jsdelivr.net/npm/vega@6.2.0"></script>
  <script src="https://cdn.jsdelivr.net/npm/vega-lite@6.4.1"></script>
  <script src="https://cdn.jsdelivr.net/npm/vega-embed@7.1.0"></script>
</head>
<body>
  <div id="vis"/>
  <script>
    const spec = {
  "$schema": "https://vega.github.io/schema/vega-lite/v5.json",
  "title": "Educação x Longevidade por Região",
  "description": "Comparação entre os índices médios de educação e longevidade das regiões brasileiras",
  "width": 750,
  "height": 500,
  "data": {
    "url": "https://raw.githubusercontent.com/Gilberto-Anderson/Projeto_Analise_de_dados/refs/heads/main/brasil_2022_regioes_corrigidas.csv"
  },
  "transform": [
    {
      "aggregate": [
        {"op": "mean", "field": "IDHM_Educacao", "as": "MEDIA_EDUCACAO"},
        {"op": "mean", "field": "IDHM_Longevidade", "as": "MEDIA_LONG"}
      ],
      "groupby": ["regiao"]
    }
  ],
  "mark": {
    "type": "circle",
    "opacity": 0.85,
    "stroke": "black",
    "strokeWidth": 1.2
  },
  "encoding": {
    "x": {
      "field": "MEDIA_EDUCACAO",
      "type": "quantitative",
      "title": "Média IDHM Educação",
      "scale": {"zero": false},
      "axis": {
        "labelFontSize": 12,
        "titleFontSize": 14,
        "format": ".3f",
        "grid": true
      }
    },
    "y": {
      "field": "MEDIA_LONG",
      "type": "quantitative",
      "title": "Média IDHM Longevidade",
      "scale": {"zero": false},
      "axis": {"labelFontSize": 12, "titleFontSize": 14, "format": ".3f"}
    },
    "size": {"value": 700},
    "color": {"field": "regiao", "type": "nominal", "title": "Região"},
    "tooltip": [
      {"field": "regiao", "type": "nominal", "title": "Região"},
      {
        "field": "MEDIA_EDUCACAO",
        "type": "quantitative",
        "title": "Educação Média",
        "format": ".3f"
      },
      {
        "field": "MEDIA_LONG",
        "type": "quantitative",
        "title": "Longevidade Média",
        "format": ".3f"
      }
    ]
  },
  "config": {
    "background": "#ffffff",
    "view": {"stroke": "transparent"},
    "axis": {"domain": false},
    "legend": {"titleFontSize": 13, "labelFontSize": 12},
    "title": {"fontSize": 20, "anchor": "start"}
  }
};
    vegaEmbed("#vis", spec, {mode: "vega-lite"}).then(console.log).catch(console.warn);
  </script>
</body>
</html>

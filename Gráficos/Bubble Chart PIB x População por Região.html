<!DOCTYPE html>
<html>
<head>
  <script src="https://cdn.jsdelivr.net/npm/vega@6.2.0"></script>
  <script src="https://cdn.jsdelivr.net/npm/vega-lite@6.4.1"></script>
  <script src="https://cdn.jsdelivr.net/npm/vega-embed@7.1.0"></script>
</head>
<body>
  <div id="vis"/>
  <script>
    const spec = {
  "$schema": "https://vega.github.io/schema/vega-lite/v5.json",
  "title": "PIB x População por Região",
  "description": "Bubble Chart PIB x População por Região",
  "width": 750,
  "height": 500,
  "data": {
    "url": "https://raw.githubusercontent.com/Gilberto-Anderson/Projeto_Analise_de_dados/refs/heads/main/brasil_2022_regioes_corrigidas.csv"
  },
  "transform": [
    {"calculate": "toNumber(datum.PIB)", "as": "PIB_NUM"},
    {"calculate": "toNumber(datum.POPULACAO_ESTIMADA)", "as": "POP_NUM"},
    {
      "aggregate": [
        {"op": "sum", "field": "PIB_NUM", "as": "PIB_TOTAL"},
        {"op": "sum", "field": "POP_NUM", "as": "POP_TOTAL"},
        {"op": "mean", "field": "IDHM", "as": "MEDIA_IDHM"}
      ],
      "groupby": ["regiao"]
    }
  ],
  "mark": {
    "type": "circle",
    "opacity": 0.85,
    "stroke": "black",
    "strokeWidth": 1.2
  },
  "encoding": {
    "x": {
      "field": "POP_TOTAL",
      "type": "quantitative",
      "title": "População Total",
      "axis": {
        "labelFontSize": 12,
        "titleFontSize": 15,
        "format": ",.0f",
        "grid": true
      }
    },
    "y": {
      "field": "PIB_TOTAL",
      "type": "quantitative",
      "title": "PIB Total",
      "axis": {
        "labelFontSize": 12,
        "titleFontSize": 15,
        "format": ",.0f",
        "grid": true
      }
    },
    "size": {
      "field": "MEDIA_IDHM",
      "type": "quantitative",
      "title": "IDHM Médio",
      "scale": {"zero": false, "range": [400, 4000]}
    },
    "color": {
      "field": "regiao",
      "type": "nominal",
      "title": "Região",
      "legend": {"titleFontSize": 13, "labelFontSize": 12}
    },
    "tooltip": [
      {"field": "regiao", "type": "nominal", "title": "Região"},
      {
        "field": "POP_TOTAL",
        "type": "quantitative",
        "title": "População Total",
        "format": ",.0f"
      },
      {
        "field": "PIB_TOTAL",
        "type": "quantitative",
        "title": "PIB Total",
        "format": ",.0f"
      },
      {
        "field": "MEDIA_IDHM",
        "type": "quantitative",
        "title": "IDHM Médio",
        "format": ".3f"
      }
    ]
  },
  "config": {
    "background": "#ffffff",
    "view": {"stroke": "transparent"},
    "axis": {"domain": false, "tickColor": "#cccccc"},
    "title": {"fontSize": 22, "anchor": "start"}
  }
};
    vegaEmbed("#vis", spec, {mode: "vega-lite"}).then(console.log).catch(console.warn);
  </script>
</body>
</html>

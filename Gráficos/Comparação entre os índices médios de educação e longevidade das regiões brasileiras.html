<!DOCTYPE html>
<html>
<head>
  <script src="https://cdn.jsdelivr.net/npm/vega@6.2.0"></script>
  <script src="https://cdn.jsdelivr.net/npm/vega-lite@6.4.1"></script>
  <script src="https://cdn.jsdelivr.net/npm/vega-embed@7.1.0"></script>
</head>
<body>
  <div id="vis"/>
  <script>
    const spec = {
  "$schema": "https://vega.github.io/schema/vega-lite/v5.json",
  "title": "Comparação Regional: IDHM Educação vs. Longevidade",
  "description": "Barras agrupadas comparando as médias de educação e longevidade por macrorregião.",
  "width": 150,
  "height": 400,
  "data": {
    "url": "https://raw.githubusercontent.com/Gilberto-Anderson/Projeto_Analise_de_dados/refs/heads/main/brasil_2022_regioes_corrigidas.csv"
  },
  "transform": [
    {
      "aggregate": [
        {"op": "mean", "field": "IDHM_Educacao", "as": "Educação"},
        {"op": "mean", "field": "IDHM_Longevidade", "as": "Longevidade"}
      ],
      "groupby": ["regiao"]
    },
    {"fold": ["Educação", "Longevidade"], "as": ["Indicador", "Valor"]}
  ],
  "config": {"view": {"stroke": "transparent"}},
  "encoding": {
    "x": {
      "field": "Indicador",
      "type": "nominal",
      "title": null,
      "axis": {"labelAngle": 0, "labelFontSize": 11}
    },
    "y": {
      "field": "Valor",
      "type": "quantitative",
      "title": "Média do Índice",
      "scale": {"domain": [0.5, 0.9]},
      "axis": {
        "grid": true,
        "format": ".3f",
        "labelFontSize": 11,
        "titleFontSize": 13
      }
    },
    "color": {
      "field": "Indicador",
      "type": "nominal",
      "scale": {"range": ["#3b82f6", "#10b981"]},
      "legend": {
        "title": "Indicador Socioeconômico",
        "orient": "top",
        "labelFontSize": 12,
        "titleFontSize": 12
      }
    },
    "column": {
      "field": "regiao",
      "type": "nominal",
      "title": "Macrorregiões brasileiras",
      "header": {"labelFontSize": 13, "titleFontSize": 14, "labelPadding": 10}
    },
    "tooltip": [
      {"field": "regiao", "type": "nominal", "title": "Região"},
      {"field": "Indicador", "type": "nominal"},
      {
        "field": "Valor",
        "type": "quantitative",
        "title": "Média Corrigida",
        "format": ".3f"
      }
    ]
  },
  "mark": {
    "type": "bar",
    "stroke": "white",
    "strokeWidth": 1,
    "cornerRadiusTopLeft": 8,
    "cornerRadiusTopRight": 8
  }
}
    vegaEmbed("#vis", spec, {mode: "vega-lite"}).then(console.log).catch(console.warn);
  </script>
</body>
</html>

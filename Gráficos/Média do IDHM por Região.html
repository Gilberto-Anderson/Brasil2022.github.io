<!DOCTYPE html>
<html>
<head>
  <script src="https://cdn.jsdelivr.net/npm/vega@6.2.0"></script>
  <script src="https://cdn.jsdelivr.net/npm/vega-lite@6.4.1"></script>
  <script src="https://cdn.jsdelivr.net/npm/vega-embed@7.1.0"></script>
</head>
<body>
  <div id="vis"/>
  <script>
    const spec = {
  "$schema": "https://vega.github.io/schema/vega-lite/v5.json",
  "title": "Média do IDHM por Região",
  "width": 650,
  "height": 420,
  "data": {
    "url": "https://raw.githubusercontent.com/Gilberto-Anderson/Projeto_Analise_de_dados/refs/heads/main/brasil_2022_regioes_corrigidas.csv"
  },
  "mark": {"type": "bar", "cornerRadiusTopLeft": 6, "cornerRadiusTopRight": 6},
  "encoding": {
    "x": {
      "field": "regiao",
      "type": "nominal",
      "title": "Região",
      "axis": {"labelAngle": 0, "labelFontSize": 12, "titleFontSize": 14}
    },
    "y": {
      "aggregate": "mean",
      "field": "IDHM",
      "type": "quantitative",
      "title": "Média do IDHM",
      "scale": {"zero": false},
      "axis": {
        "labelFontSize": 12,
        "titleFontSize": 14,
        "format": ".3f",
        "grid": true
      }
    },
    "color": {"field": "regiao", "type": "nominal", "title": "Região"},
    "tooltip": [
      {"field": "regiao", "type": "nominal", "title": "Região"},
      {
        "aggregate": "mean",
        "field": "IDHM",
        "type": "quantitative",
        "title": "Média IDHM",
        "format": ".3f"
      }
    ]
  },
  "config": {
    "background": "#ffffff",
    "view": {"stroke": "transparent"},
    "axis": {"domain": false},
    "title": {"fontSize": 18, "anchor": "start"}
  }
};
    vegaEmbed("#vis", spec, {mode: "vega-lite"}).then(console.log).catch(console.warn);
  </script>
</body>
</html>
